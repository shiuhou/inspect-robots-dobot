[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-dobot"
version = "0.1.0"
description = "Dobot Nova fake embodiment and query-only diagnostics for Inspect Robots."
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["inspect-robots", "numpy>=1.24,<2.5"]

[project.optional-dependencies]
agent = ["inspect-robots-agent"]

[dependency-groups]
dev = ["inspect-robots-agent", "pytest>=8", "pytest-cov>=5", "pytest-socket>=0.7", "mypy>=1.11", "ruff>=0.6"]

[tool.uv.sources]
inspect-robots = { git = "https://github.com/robocurve/inspect-robots", rev = "7e506e3b6f39530f18e75cf97b23c4287aa90f12" }
inspect-robots-agent = { git = "https://github.com/robocurve/inspect-robots", rev = "7e506e3b6f39530f18e75cf97b23c4287aa90f12", subdirectory = "plugins/inspect-robots-agent" }

[project.entry-points."inspect_robots.embodiments"]
dobot_nova = "inspect_robots_dobot.embodiment:DobotEmbodiment"

[project.scripts]
inspect-robots-dobot-preflight = "inspect_robots_dobot.preflight:main"
inspect-robots-dobot-health = "inspect_robots_dobot.health:main"
inspect-robots-dobot-micro-move = "inspect_robots_dobot.micro_move:main"
inspect-robots-dobot-motion-dry-run = "inspect_robots_dobot.motion_dry_run:main"
inspect-robots-dobot-camera-smoke = "inspect_robots_dobot.camera_smoke:main"
inspect-robots-dobot-astra-shadow = "inspect_robots_dobot.astra_shadow_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_dobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/inspect_robots_dobot"]

[tool.coverage.run]
branch = true
source = ["inspect_robots_dobot"]
